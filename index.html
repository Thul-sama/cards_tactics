<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Tactics — prototype</title>
<style>
  :root {
    --fond: #f2efe8; --texte: #1e1e1e; --bord: #6b6b6b; --carte: #ffffff; --barre: #e2ddd2;
    --sel: #1f6fd1; --cible: #d23a1f; --pret: #2e8b3e;
    --ennemi: #f8e6e2; --joueur: #e3edf8;
    --commune: #8a8a8a; --rare: #2f6fd0; --epique: #8a3fc0; --legendaire: #d08a12;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #1b1b1d; --texte: #e8e6e1; --bord: #8a8a8a; --carte: #2a2a2e; --barre: #26262a;
      --sel: #5aa0ff; --cible: #ff6a4d; --pret: #5cc46d;
      --ennemi: #3a2826; --joueur: #23303f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.35 system-ui, -apple-system, sans-serif; background: var(--fond); color: var(--texte); }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--barre); border-bottom: 1px solid var(--bord); }
  #infos { flex: 1; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 14px; }
  main { max-width: 760px; margin: 0 auto; padding: 4px 12px 40px; }
  h2 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 4px 0; }
  .zone { border: 1px solid var(--bord); border-radius: 6px; padding: 8px; margin: 8px 0; }
  .ennemi { background: var(--ennemi); }
  .joueur { background: var(--joueur); }
  .rang { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .btn { min-height: 44px; padding: 6px 14px; border: 2px solid var(--bord); border-radius: 6px; background: var(--carte); }
  .btn.principal { border-color: var(--sel); font-weight: bold; }
  .carte { flex: 1 1 100px; max-width: 170px; min-height: 72px; padding: 6px; text-align: left;
    display: flex; flex-direction: column; gap: 2px; border: 2px solid var(--bord); border-radius: 6px;
    background: var(--carte); border-left-width: 6px; }
  .carte small { opacity: .75; font-size: 12px; }
  .carte .stats { font-size: 18px; font-weight: bold; }
  .carte .prix { margin-top: auto; font-weight: bold; }
  .r-commune { border-left-color: var(--commune); }
  .r-rare { border-left-color: var(--rare); }
  .r-epique { border-left-color: var(--epique); }
  .r-legendaire { border-left-color: var(--legendaire); }
  .vide { border-style: dashed; opacity: .5; justify-content: center; align-items: center; background: transparent; }
  .piege { min-height: 48px; }
  .cache { justify-content: center; text-align: center; font-weight: bold; }
  .pret { border-color: var(--pret); }
  .sel { outline: 3px solid var(--sel); outline-offset: 1px; }
  .cible { outline: 3px dashed var(--cible); outline-offset: 1px; }
  .heros { display: block; width: 100%; min-height: 44px; padding: 8px; text-align: left;
    border: 2px solid var(--bord); border-radius: 6px; background: var(--carte); }
  .intention { font-size: 14px; }
  .aide { font-size: 13px; opacity: .8; }
  .log ol { margin: 0; padding-left: 18px; font-size: 13px; }
  .log li:first-child { font-weight: bold; }
  #pause { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; background: rgba(0,0,0,.7); color: #fff; font-size: 20px; }
  #pause[hidden] { display: none; }
  #pause .btn { color: var(--texte); }
</style>
</head>
<body>
<header>
  <div id="infos"></div>
  <button class="btn" data-action="pause" aria-label="Pause">⏸ Pause</button>
</header>
<main id="jeu"></main>
<div id="pause" hidden>
  <p>Pause</p>
  <button class="btn principal" data-action="pause">Reprendre</button>
</div>
<script src="data/config.js"></script>
<script src="data/cards.js"></script>
<script src="data/enemies.js"></script>
<script src="js/jeu.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
